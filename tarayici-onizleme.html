<!doctype html><html><head><title>At Yarışı (önizleme)</title><meta charset="utf-8"></head><body style="margin:0;background:#000">
<canvas id="c" width="1280" height="720" style="width:100%;max-width:1280px;display:block;margin:auto;cursor:pointer"></canvas>
<script>
// Form1.cs OnPaint'in birebir aktarımı (önizleme)
const c=document.getElementById('c'),g=c.getContext('2d');
const W=1280,H=720,UstBosluk=96,Serit=124,PistUst=UstBosluk+34,S=1.3,bas=160,bit=W-130;
const rgb=(r,G,b,a=255)=>`rgba(${r},${G},${b},${a/255})`;
const atlar=[{ad:'Kızıl Yıldırım',govde:rgb(150,82,42),koyu:rgb(110,58,28),yele:rgb(52,28,14),forma:[230,57,70]},
{ad:'Beyaz Rüzgar',govde:rgb(236,230,218),koyu:rgb(196,188,172),yele:rgb(170,160,145),forma:[29,111,216]},
{ad:'Kara Şimşek',govde:rgb(44,44,50),koyu:rgb(24,24,28),yele:rgb(10,10,12),forma:[245,183,0]}];
const F=a=>rgb(...a);
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function font(sz,b){return (b?'bold ':'')+Math.round(sz*96/72)+'px "Segoe UI",Arial';}
function txt(s,sz,b,col,x,y,al='left',bl='top'){g.font=font(sz,b);g.fillStyle=col;g.textAlign=al;g.textBaseline=bl;g.fillText(s,x,y);}
function line(x1,y1,x2,y2,w,col){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.lineWidth=w;g.lineCap='round';g.strokeStyle=col;g.stroke();}
function circ(x,y,r,col){g.beginPath();g.arc(x,y,r,0,7);g.fillStyle=col;g.fill();}
function P(cmds,fill){g.beginPath();for(const k of cmds){if(k[0]=='M')g.moveTo(k[1],k[2]);else if(k[0]=='L')g.lineTo(k[1],k[2]);else g.bezierCurveTo(k[1],k[2],k[3],k[4],k[5],k[6]);}g.closePath();g.fillStyle=fill;g.fill();}
function leg(hx,hy,a1,a2,col){const kx=hx+Math.sin(a1)*20,ky=hy+Math.cos(a1)*20,fx=kx+Math.sin(a2)*19,fy=ky+Math.cos(a2)*19;line(hx,hy,kx,ky,8,col);line(kx,ky,fx,fy,5,col);circ(fx,fy,3.5,'#222');}
function horse(a,x,y,num,ph,sal){g.save();g.translate(x,y);g.scale(S,S);
 g.fillStyle='rgba(0,0,0,.235)';g.beginPath();g.ellipse(0,2,46,6,0,0,7);g.fill();
 const sw=Math.sin(ph);
 leg(26,-40,sal*(0.9*sw)+0.25,sal*(0.9*sw-0.35+(sw<0?-0.6:0)),a.koyu);
 const s2=Math.sin(ph+2.2);leg(-24,-42,sal*(-0.8*s2)+0.1,sal*(-0.8*s2)+0.7*sal+0.1,a.koyu);
 g.beginPath();g.moveTo(-34,-50);g.bezierCurveTo(-46,-56,-56,-46,-62,-34+sw*3*sal);g.lineWidth=7;g.lineCap='round';g.strokeStyle=a.yele;g.stroke();
 P([['M',-36,-48],['C',-36,-63,-12,-64,10,-61],['C',28,-61,38,-54,38,-44],['C',38,-33,22,-30,0,-30],['C',-22,-30,-37,-34,-36,-48]],a.govde);
 P([['M',18,-56],['C',26,-68,32,-80,40,-90],['L',52,-86],['C',50,-72,46,-56,36,-40]],a.govde);
 P([['M',39,-91],['C',45,-98,55,-96,59,-89],['L',72,-76],['C',74,-71,69,-67,64,-69],['L',50,-76],['C',44,-79,39,-85,39,-91]],a.govde);
 P([['M',44,-93],['L',46,-103],['L',51,-94]],a.govde);circ(53,-87,2,'#000');circ(68.3,-72.7,1.3,'#000');
 g.beginPath();g.moveTo(43,-94);g.bezierCurveTo(36,-84,30,-72,20,-60);g.lineWidth=6;g.strokeStyle=a.yele;g.stroke();
 const s3=Math.sin(ph+0.6);leg(22,-38,sal*(-0.9*s3)+0.2,sal*(-0.9*s3-0.5),a.govde);
 const s4=Math.sin(ph+2.8);leg(-20,-40,sal*(0.8*s4)+0.1,sal*(0.8*s4)+0.7*sal+0.1,a.govde);
 P([['M',-14,-60],['L',8,-61],['L',9,-42],['L',-13,-41]],F(a.forma));
 txt(String(num),9,1,'#fff',-2.5,-50.5,'center','middle');
 line(0,-64,10,-56,6,rgb(244,244,244));line(10,-56,4,-47,5,rgb(51,51,51));line(-2,-64,10,-80,11,F(a.forma));line(8,-77,26,-70,4,F(a.forma));
 circ(14,-87,6,rgb(241,194,125));g.beginPath();g.arc(14,-88,6.5,Math.PI,0);g.fillStyle=F(a.forma);g.fill();line(26,-70,40,-82,1.2,rgb(90,58,26));
 g.restore();}
function lg(x0,y0,x1,y1,c0,c1){const l=g.createLinearGradient(x0,y0,x1,y1);l.addColorStop(0,c0);l.addColorStop(1,c1);return l;}
function scene(st){const {xs,ph,sal,durum,gs,tahmin,sure,sira}=st;
 g.fillStyle=lg(0,0,W,0,rgb(18,24,48),rgb(40,30,78));g.fillRect(0,0,W,UstBosluk);line(0,UstBosluk-2,W,UstBosluk-2,3,rgb(245,183,0));g.lineCap='butt';
 txt('AT YARIŞI',26,1,'#fff',30,14);txt("Bir at seç, tahminini yap, BAŞLAT'a bas!",11,0,rgb(180,190,220),34,60);
 rr(W-210,22,180,50,12);g.fillStyle=rgb(255,255,255,60);g.fill();g.font='bold 29px Consolas,monospace';g.fillStyle=rgb(245,183,0);g.textAlign='center';g.textBaseline='middle';g.fillText(sure+' sn',W-120,47);
 const alt=PistUst+3*Serit;
 g.fillStyle=lg(0,UstBosluk,0,PistUst,rgb(46,125,50),rgb(67,160,71));g.fillRect(0,UstBosluk,W,PistUst-UstBosluk);g.fillStyle=rgb(56,142,60);g.fillRect(0,alt,W,24);
 for(let i=0;i<3;i++){const y=PistUst+i*Serit;g.fillStyle=i%2==0?lg(0,y,0,y+Serit,rgb(196,140,88),rgb(172,118,70)):lg(0,y,0,y+Serit,rgb(184,128,78),rgb(160,108,62));g.fillRect(0,y,W,Serit);
  for(let x=(i*37)%80;x<W;x+=80){g.beginPath();g.moveTo(x,y+30+(x%3)*25);g.lineTo(x+30,y+30+(x%3)*25);g.lineWidth=2;g.strokeStyle=rgb(90,50,20,25);g.stroke();}
  txt(String(i+1),28,1,rgb(255,255,255,60),bit+50,y+34);}
 for(let i=0;i<=3;i++){const y=PistUst+i*Serit;g.lineCap='butt';g.beginPath();g.moveTo(0,y+3);g.lineTo(W,y+3);g.lineWidth=2;g.strokeStyle=rgb(0,0,0,70);g.stroke();g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.lineWidth=4;g.strokeStyle='#fff';g.stroke();}
 g.fillStyle='#fff';for(let x=40;x<W;x+=120){g.fillRect(x,PistUst-14,5,14);g.fillRect(x,alt,5,14);}
 const top=bit-bas;for(let m=1;m<4;m++){const x=bas+top*m/4;txt((m*250)+' m',9,1,rgb(255,255,255,220),x-14,PistUst-30);g.setLineDash([6,4]);g.beginPath();g.moveTo(x,PistUst);g.lineTo(x,alt);g.lineWidth=2;g.strokeStyle=rgb(255,255,255,50);g.stroke();g.setLineDash([]);}
 g.beginPath();g.moveTo(bas,PistUst);g.lineTo(bas,alt);g.lineWidth=4;g.strokeStyle=rgb(255,255,255,230);g.stroke();
 for(let y=PistUst,s=0;y<alt;y+=12,s++)for(let k=0;k<2;k++){g.fillStyle=(s+k)%2==0?'#fff':'#000';g.fillRect(bit+k*12,y,12,Math.min(12,alt-y));}
 txt('BİTİŞ',10,1,'#fff',bit-6,PistUst-30);
 for(let i=0;i<3;i++)horse(atlar[i],xs[i],PistUst+i*Serit+Serit-14,i+1,ph[i],sal[i]);
 const PU=alt+24;g.fillStyle=lg(0,PU,0,H,rgb(24,28,52),rgb(14,16,30));g.fillRect(0,PU,W,H-PU);
 const kw=(W-300)/3|0;
 for(let i=0;i<3;i++){const a=atlar[i],kx=24+i*(kw+12),ky=PU+16,kh=H-PU-32,sec=tahmin==i;
  rr(kx,ky,kw,kh,14);g.fillStyle=sec?rgb(...a.forma,60):rgb(34,40,70);g.fill();g.lineWidth=sec?3:1;g.strokeStyle=sec?F(a.forma):rgb(60,70,110);g.stroke();
  circ(kx+32,ky+32,18,F(a.forma));txt(String(i+1),13,1,'#fff',kx+32,ky+33,'center','middle');
  txt(a.ad,13,1,'#fff',kx+58,ky+12);let al=sec?'★ Senin tahminin':'Tahmin için tıkla';if(sira[i])al=sira[i]+'. oldu';txt(al,9,0,rgb(160,170,200),kx+60,ky+36);
  let o=Math.max(0,Math.min(1,(xs[i]+74*S-bas)/(top+20)));if(sira[i])o=1;const cx=kx+14,cy=ky+kh-34,cw=kw-28;rr(cx,cy,cw,18,9);g.fillStyle=rgb(14,16,30);g.fill();
  const d=cw*o|0;if(d>18){rr(cx,cy,d,18,9);g.fillStyle=lg(cx,0,cx+d,0,rgb(...a.forma.map(v=>v+(255-v)*0.5)),F(a.forma));g.fill();}
  txt('%'+(o*100|0),8,1,'#fff',cx+cw-36,cy+2);}
 // butonlar
 g.fillStyle=rgb(245,183,0);g.fillRect(1046,544,210,70);txt(st.btn||'BAŞLAT',16,1,rgb(18,24,48),1151,579,'center','middle');
 g.fillStyle=rgb(44,52,90);g.fillRect(1046,626,210,46);txt('SIFIRLA',11,1,'#fff',1151,649,'center','middle');
 if(durum=='GeriSayim'){const y=gs<25?'3':gs<50?'2':gs<75?'1':'KOŞ!';const t=(gs%25)/25,b=90-30*t,al=255*(1-t*0.6);g.fillStyle=rgb(0,0,0,70);g.fillRect(0,PistUst,W,3*Serit);
  g.font=font(b,1);g.textAlign='center';g.textBaseline='middle';g.fillStyle=rgb(0,0,0,al/2);g.fillText(y,W/2+4,PistUst+186+4);g.fillStyle=rgb(245,183,0,al);g.fillText(y,W/2,PistUst+186);}
 if(durum=='Bitti'){const k=[W/2-260,PistUst+60,520,230];g.fillStyle=rgb(0,0,0,110);g.fillRect(0,PistUst,W,3*Serit);rr(...k,22);g.fillStyle=lg(0,k[1],0,k[1]+230,rgb(40,30,78),rgb(18,24,48));g.fill();g.lineWidth=4;g.strokeStyle=rgb(245,183,0);g.stroke();
  txt('KAZANAN',14,1,rgb(245,183,0),W/2,k[1]+31,'center','middle');
  const x=W/2,y=k[1]+90,au=rgb(245,183,0);g.fillStyle=au;g.beginPath();g.ellipse(x,y-24,20,22,0,0,Math.PI);g.fill();g.fillRect(x-20,y-26,40,4);
  g.lineWidth=4;g.strokeStyle=au;g.beginPath();g.ellipse(x-22,y-27,8,9,0,Math.PI/2,Math.PI*1.5);g.stroke();g.beginPath();g.ellipse(x+22,y-27,8,9,0,-Math.PI/2,Math.PI/2);g.stroke();g.fillRect(x-3,y-4,6,10);g.fillRect(x-13,y+6,26,6);
  const w=st.kaz;txt((w+1)+' - '+atlar[w].ad,24,1,w==1?rgb(120,175,255):F(atlar[w].forma),W/2,k[1]+143,'center','middle');
  txt('Süre: '+sure+' sn'+(tahmin<0?'':'   •   '+(tahmin==w?'Tahminin tuttu!':'Tahminin tutmadı')),12,0,rgb(200,210,235),W/2,k[1]+190,'center','middle');}
}

// ---- Oyun mantığı (Form1.cs ile aynı) ----
const R=(a,b)=>a+Math.floor(Math.random()*(b-a)); // Random.Next(a,b)
const enSag=W-20-74*S;
let at=[],durum='Bekliyor',gs=0,tik=0,biten=0,kaz=-1,tahmin=-1,btn='BAŞLAT';
function sifirla(){at=atlar.map(()=>({x:bas-74*S-6,hiz:0,adim:Math.random()*6,sira:0}));biten=0;tik=0;kaz=-1;durum='Bekliyor';}
function ciz(){scene({xs:at.map(a=>a.x),ph:at.map(a=>a.adim),sal:at.map(a=>(durum=='Bekliyor'||durum=='GeriSayim')?0.15:Math.min(1,a.hiz/2.5)),durum,gs,tahmin,sure:(tik*0.03).toFixed(1),sira:at.map(a=>a.sira),kaz,btn});}
let zam=null;
function tick(){
 if(durum=='GeriSayim'){gs++;if(gs>=100)durum='Kosuyor';}
 else if(durum=='Kosuyor'){tik++;at.forEach((a,i)=>{
   if(a.sira>0)a.hiz=Math.max(0,a.hiz-0.3);else{a.hiz+=R(-1,2)*0.5;a.hiz=Math.max(2.5,Math.min(7.5,a.hiz));}
   a.x+=a.hiz+Math.random()*1.5;a.x=Math.min(a.x,enSag);a.adim+=0.12+a.hiz*0.05;
   if(a.sira==0&&a.x+74*S>=bit){biten++;a.sira=biten;if(kaz<0)kaz=i;}});
   if(biten==3)durum='Bitti';}
 else if(durum=='Bitti'){let dur=true;at.forEach(a=>{a.hiz=Math.max(0,a.hiz-0.3);a.x=Math.min(a.x+a.hiz,enSag);if(a.hiz>0){a.adim+=0.12+a.hiz*0.05;dur=false;}});
   if(dur){clearInterval(zam);zam=null;btn='TEKRAR';}}
 ciz();}
c.addEventListener('click',e=>{const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*W/r.width,my=(e.clientY-r.top)*H/r.height;
 if(mx>=1046&&mx<=1256&&my>=544&&my<=614&&!zam){sifirla();btn='BAŞLAT';durum='GeriSayim';gs=0;zam=setInterval(tick,30);return;}
 if(mx>=1046&&mx<=1256&&my>=626&&my<=672){clearInterval(zam);zam=null;btn='BAŞLAT';sifirla();ciz();return;}
 if(durum=='Kosuyor'||durum=='GeriSayim')return;
 const PU=PistUst+3*Serit+24,kw=(W-300)/3|0;for(let i=0;i<3;i++){const kx=24+i*(kw+12);if(mx>=kx&&mx<=kx+kw&&my>=PU+16&&my<=H-16){tahmin=tahmin==i?-1:i;ciz();}}});
sifirla();ciz();
</script></body></html>
